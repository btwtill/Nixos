# Minimal compositor for the Homy UI (VM + Pi 5): only what transparent windows
# need — the Rive sidebar (and later the bars and apps) draw their own pixels,
# with the wallpaper (homy-wallpaper) showing through. No shadows, rounding,
# fading or dimming: those would change how the designs look.

backend = "xrender";      # works without a real GPU (VM); glx may be faster on the Pi 5 — measure first
vsync = false;
use-damage = true;        # only repaint what changed, not the whole screen

shadow = false;
fading = false;
corner-radius = 0;
blur: { method = "none"; };

inactive-opacity = 1.0;   # never dim unfocused windows
active-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;
