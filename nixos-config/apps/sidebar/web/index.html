<!doctype html>
<!--
  Plays the SideBar artboard of sidebar.riv. main.py serves this page, the
  Rive runtime (/vendor/<renderer>/) and the file (/sidebar.riv).
    renderer = webgl2 | canvas   (webgl2: the only one that draws feathers and
                                  blend modes, which the design uses)
-->
<html>
<head>
<meta charset="utf-8">
<title>Homy Sidebar</title>
<style>
  /* transparent: only the Rive artboard draws — the wallpaper shows through the rest */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const ARTBOARD = "SideBar";
const params   = new URLSearchParams(location.search);
const hasWebGL2 = !!document.createElement("canvas").getContext("webgl2");
const renderer = params.get("renderer") === "canvas" || !hasWebGL2 ? "canvas" : "webgl2";
const canvas   = document.getElementById("c");

// main.py reads console lines starting with "homy:".
const emit = (kind, data) => console.log("homy:" + kind + " " + JSON.stringify(data));

let r = null, active = null;
let hostValue = 0;    // last activeIndex set by main.py — not a tap, don't report it back
let reported  = null; // last tap reported (the change callback can fire more than once)

// Called by main.py: highlight the button for the current Qtile group (-1 = none).
window.homy = {
  setActive(i) {
    hostValue = i;
    reported = null;
    if (active) active.value = i;
  },
};

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error("cannot load " + src));
    document.head.appendChild(s);
  });
}

loadScript(`vendor/${renderer}/rive.js`).then(() => {
  rive.RuntimeLoader.setWasmUrl(`vendor/${renderer}/rive.wasm`);
  rive.RuntimeLoader.setWasmFallbackUrl(`vendor/${renderer}/rive_fallback.wasm`);
  rive.Rive.suppressDeprecationWarnings = ["default-state-machine"];
  const layout = new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.TopCenter });

  // Pass 1 reads the artboard's state machine name; pass 2 starts it by name,
  // which is what wires up taps (Rive listeners) and data binding.
  const probe = new rive.Rive({
    src: "sidebar.riv", canvas, artboard: ARTBOARD, autoplay: false,
    onLoadError: () => emit("error", "could not load sidebar.riv"),
    onLoad: () => {
      const machine = probe.stateMachineNames[0];
      probe.cleanup();
      r = new rive.Rive({
        src: "sidebar.riv", canvas, artboard: ARTBOARD, layout,
        stateMachine: machine, autoplay: true, autoBind: true,
        onLoad: () => {
          r.resizeDrawingSurfaceToCanvas();
          active = r.viewModelInstance && r.viewModelInstance.number("activeIndex");
          if (!active) { emit("error", "SideBar has no activeIndex — check the view model"); return; }
          active.value = hostValue;
          // A tap writes activeIndex inside the file; report it so main.py navigates.
          active.on(() => {
            const v = active.value;
            if (v !== hostValue && v !== reported) { reported = v; emit("navigate", v); }
          });
          const gl = document.createElement("canvas").getContext("webgl2");
          const ext = gl && gl.getExtension("WEBGL_debug_renderer_info");
          emit("loaded", { renderer, machine,
                           gpu: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : (gl ? "webgl2" : "none") });
        },
      });
    },
  });
}).catch(e => emit("error", String(e)));

window.addEventListener("resize", () => r && r.resizeDrawingSurfaceToCanvas());
</script>
</body>
</html>
