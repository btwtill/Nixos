<!doctype html>
<!-- Top bar surface: the TopBar artboard of topbar.riv (Terminal, app menu, Wi-Fi). -->
<html>
<head>
<meta charset="utf-8">
<title>Homy Top Bar</title>
<style>
  /* transparent: only the Rive artboard draws */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="shell.js"></script>
<script>
// layout: the artboard takes the window's size (full screen width × 40)
startNavSurface({ riv: "topbar", artboard: "TopBar", fit: "layout" });
</script>
</body>
</html>
